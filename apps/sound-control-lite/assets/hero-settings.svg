<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Settings and Permissions placeholder</title>
  <desc id="desc">A macOS settings placeholder with permission rows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe5d7"/>
      <stop offset="0.45" stop-color="#f8a3b6"/>
      <stop offset="1" stop-color="#786dff"/>
    </linearGradient>
  </defs>
  <rect width="920" height="560" rx="44" fill="url(#bg)"/>
  <rect x="156" y="84" width="608" height="392" rx="34" fill="#fff" opacity="0.9"/>
  <rect x="156" y="84" width="608" height="64" rx="34" fill="#fff" opacity="0.62"/>
  <circle cx="202" cy="116" r="10" fill="#ff756c"/>
