<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lumos projects and Daoming Liu's professional engineering portfolio.">
  <title>Lumos | Daoming Liu</title>
  <style>
    :root {
      --navy: #061a3f;
      --navy-soft: #0b2554;
      --peach: #ffc1ad;
      --coral: #ff8fa3;
      --pink: #f472b6;
      --lavender: #c084fc;
      --violet: #7c5cff;
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.66);
      --line: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 143, 163, 0.28), transparent 26rem),
        radial-gradient(circle at 76% 22%, rgba(124, 92, 255, 0.36), transparent 30rem),
        radial-gradient(circle at 52% 82%, rgba(192, 132, 252, 0.24), transparent 28rem),
        linear-gradient(145deg, #030a1c 0%, var(--navy) 46%, var(--navy-soft) 100%);
    }

    body::before,
    body::after {
      position: fixed;
      content: "";
      pointer-events: none;
    }

    body::before {
      inset: 0;
      background:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
      background-size: 80px 80px;
      opacity: 0.58;
    }

    body::after {
      width: 34rem;
      height: 34rem;
      right: -13rem;
      bottom: -16rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 42% 58% 55% 45%;
      background:
        radial-gradient(circle at 34% 28%, rgba(255, 193, 173, 0.16), transparent 7rem),
        radial-gradient(circle at 62% 58%, rgba(244, 114, 182, 0.18), transparent 10rem),
        rgba(255, 255, 255, 0.03);
      filter: blur(0.2px);
      transform: rotate(-14deg);
    }

    main {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 28px;
    }

    .shell {
      width: min(100%, 720px);
      text-align: center;
    }

    .lumos-octopus-mark {
      display: block;
      width: clamp(140px, 16vw, 210px);
      height: auto;
      margin: 0 auto 1.75rem;
      object-fit: contain;
      opacity: 0.96;
      position: relative;
      z-index: 3;
      filter: drop-shadow(0 18px 36px rgba(180, 120, 255, 0.18));
    }

    h1 {
      margin: 0;
      font-size: clamp(4.2rem, 16vw, 9.4rem);
      font-weight: 850;
      line-height: 0.9;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 620px;
      margin: 26px auto 0;
      color: var(--text);
      font-size: clamp(1.1rem, 2.6vw, 1.45rem);
      line-height: 1.7;
    }

    .whisper {
      max-width: 560px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      line-height: 1.8;
    }

    .portfolio-entry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      min-height: 48px;
      margin-top: 28px;
      padding: 12px 20px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 28px rgba(3, 10, 28, 0.2);
      color: white;
      font-weight: 800;
      text-decoration: none;
      transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .portfolio-entry:hover,
    .portfolio-entry:focus {
      border-color: rgba(255, 193, 173, 0.72);
      background: rgba(255, 255, 255, 0.17);
      box-shadow: 0 16px 34px rgba(3, 10, 28, 0.28);
      transform: translateY(-2px);
    }

    .portfolio-entry:focus-visible {
      outline: 3px solid var(--peach);
      outline-offset: 4px;
    }

    .footer-note {
      margin-top: 48px;
      color: rgba(255, 255, 255, 0.46);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    @media (max-width: 620px) {
      body {
        overflow: auto;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      .portfolio-entry {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="shell" aria-labelledby="lumos-title">
      <img class="lumos-octopus-mark" src="source/octopus.png" alt="" aria-hidden="true">
      <h1 id="lumos-title">Lumos</h1>
      <p class="subtitle">A mysterious octopus developer building curious things from the deep.</p>
      <p class="whisper">Quiet experiments. Curious utilities. Occasional tentacles.</p>
      <a class="portfolio-entry" href="portfolio/">Daoming Liu's Professional Portfolio →</a>
      <p class="footer-note">Independent sketches.</p>
    </section>
  </main>
</body>

</html>
